# 웹 PC 컨테이너(W102) — mosquitto · web. DB 는 W088 에서 더한다.
# 실행: WEB_UID=$(id -u) WEB_GID=$(id -g) docker compose up -d   (WEB_UID · WEB_GID 가 없으면 시작하지 않는다)
# MQTT는 웹 PC Wi-Fi IPv4에만 공개하고 DOCKER-USER로 로봇 PC만 허용한다. 화면은 localhost에서만 사용한다.
# 코드 · 설정 · 레시피는 이미지에 복사하지 않고 필요한 경로만 읽기 전용으로 연결한다(.venv · node_modules · .env 는 연결하지 않음).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${D2_WEB_IPV4:?웹 PC Wi-Fi IPv4를 지정한다}:1883:1883"
    restart: "no"  # 재부팅 후 방화벽 확인 전에 브로커를 자동 공개하지 않는다

  web:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${WEB_UID:?WEB_UID 를 id -u 로 넘긴다}:${WEB_GID:?WEB_GID 를 id -g 로 넘긴다}"
    env_file: .env                       # 키는 .env 에만 — 이미지 · compose 에 넣지 않는다
    environment:
      MQTT_HOST: mosquitto               # .env 보다 우선
      MQTT_PORT: "1883"
      DATA_DIR: /data
      D2_LLM_URL: http://host.docker.internal:8790/v1   # 설계 생성 Claude 중계(호스트 claude_bridge — docker0 주소에서 듣는다, 10/13)
    volumes:
      - ./backend/app.py:/repo/web/backend/app.py:ro
      - ./backend/design_gen.py:/repo/web/backend/design_gen.py:ro
      - ./backend/design_store.py:/repo/web/backend/design_store.py:ro
      - ./backend/mqtt_client.py:/repo/web/backend/mqtt_client.py:ro
      - ./backend/mock_robot.py:/repo/web/backend/mock_robot.py:ro
      - ./backend/routes:/repo/web/backend/routes:ro
      - ./backend/prompts:/repo/web/backend/prompts:ro
      - ./frontend/out:/repo/web/frontend/out:ro
      - ../src/d2_bridge:/repo/src/d2_bridge:ro
      - ../src/d2_task:/repo/src/d2_task:ro
      - ../src/d2_robot/d2_bringup/config:/repo/src/d2_robot/d2_bringup/config:ro
      - ../src/d2_robot/d2_bringup/recipes:/repo/src/d2_robot/d2_bringup/recipes:ro
      - ./backend/data:/data             # 설계 · 조립 기록(쓰기). 호스트에 먼저 만들어 둔다(아래 실행본)
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트(claude_bridge)를 부르는 이름
    depends_on:
      - mosquitto
    restart: unless-stopped
