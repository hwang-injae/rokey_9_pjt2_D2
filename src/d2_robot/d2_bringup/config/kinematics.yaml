# MoveIt IK 계산기 설정 — 두산 MoveIt 설정(KDL, 제한 시간 15 ms)을 이 파일로 덮어쓴다(real_moveit.launch.py).
# 15 ms 는 손목을 꺾은 자세(기울여 집기 · 다시 잡기)를 자주 못 풀어 50 ms 로 늘린다. 그래도 못 풀면 executor.solve 가
# 교시 자세 · 고정 무작위 시작점으로 다시 푼다.
# pick_ik 는 쓰지 않는다(10/11 가상 확인): global 모드는 직선 이동(Pilz LIN)의 점마다 다른 팔 자세 해를 골라 관절 속도 한계를 넘고
# (joint_1 −31 rad/s), local 모드 · '덜 움직이기' 가중치는 쉬운 자세도 못 풀었다. KDL 은 시작 자세 근처에서 풀어 직선이 이어진다.
manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
