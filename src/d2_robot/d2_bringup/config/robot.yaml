# D2 설정 파일 — 좌표·높이·힘·시간은 코드에 쓰지 않고 여기 하나에 둔다 (IRD 9장).
# 단위: 길이 m (이름 끝 _m), 각 도 (_deg), 시간 s (_s), 힘 N (_n). 기준 좌표계 base_link.
# 틀: 황인재 (W031). 측정값: 로봇 동작 (W033).
# 10/6 박진용: recipe_demo/config/cell.json 값으로 처음 채움 → 10/6 다시 측정 (W011~W016).

frame_id: base_link
tcp_link: rg2_tcp                # 두산 posx 틀과 위치 같고 방향은 손목 Z 로 -90°: R_rg2tcp = R_posx · Rz(-90°) (x_rg2 = -y_posx, y_rg2 = x_posx, 10/7 W134 실측)
table_z_m: -0.018              # 작업면 높이. 지금은 1곳 값 — 3~4곳 평균으로 다시 (W015)
table:                         # MoveIt 장면의 작업대 상자 (1200 x 650 mm). 로봇 바닥 둘레 base_clear_m 만 비운다
  x_m: [-0.2675, 0.9325]
  y_m: [-0.325, 0.325]
  base_clear_m: 0.15

# 조립 원점: 설계도 (0, 0, 0) 이 로봇 좌표로 어디인지. 여기 하나만 쓴다 (10/6 직접 교시로 다시 찍음)
assembly_origin: {x_m: 0.4261, y_m: -0.0725, z_m: -0.018, yaw_deg: 0.3}
assembly_area_half_m: 0.15     # 조립 작업공간 = 조립 원점 ± 이 값 (x·y). 여러 설계를 세트로 놓을 때 이 안에 둔다

block_size_m: [0.075, 0.025, 0.015]   # 젠가 블록 설계 치수 LENGTH, WIDTH, THICKNESS = 최대 기준값 (레시피와 같아야 함)
block_actual_m: [0.07445, 0.0248, 0.0148]   # 실측 평균 (10/6) — 집는 높이·쌓는 높이·장면 상자에 쓴다
block_tolerance_m: 0.0005      # 실제 블록은 설계 치수보다 이 안에서 작다 (10/6 실측: 75 쪽은 -0.55 로 약간 넘음)

# 로봇 공급 칸 (10/6 직접 교시로 다시 찍음, 잡기 6가지 순서). block_up = 위를 향하는 블록 축,
# yaw_deg = 블록 긴 쪽 방향 (세우면 25 mm 쪽). tcp_z_m·grip_display_width_m = 10/4 교시 집는 높이 (세운 블록은 더 깊게 문다)
# grasp = 이 칸에서 쓰는 잡기 하나 (칸마다 고정 — 그리퍼 방향을 찍을 때 그대로 쓴다)
supply_slots:
  - {x_m: 0.2822, y_m: 0.1796, surface_z_m: -0.018, yaw_deg: -0.3, block_up: THICKNESS, grasp: FLAT_LONG}   # p1 FLAT_LONG (10/7 잡기 폭 시험 실기로 확정: y -2 mm — 전 0.1816)
  - {x_m: 0.2772, y_m: 0.2612, surface_z_m: -0.018, yaw_deg: -89.8, block_up: THICKNESS, grasp: FLAT_SHORT}   # p2 FLAT_SHORT (10/7 잡기 폭 시험 실기로 확정: x -1 mm — 전 0.2782)
  - {x_m: 0.4006, y_m: 0.1783, surface_z_m: -0.018, yaw_deg: 0.0, block_up: WIDTH, tcp_z_m: 0.0177, grip_display_width_m: 0.0244, grasp: EDGE_LONG}   # p3 EDGE_LONG (깊이 = p4, 10/6 실기: 계산식은 윗부분만 물림) — 10/7 잡기 폭 시험 그대로 OK
  - {x_m: 0.4031, y_m: 0.2588, surface_z_m: -0.018, yaw_deg: -89.9, block_up: WIDTH, tcp_z_m: 0.0177, grip_display_width_m: 0.0244, grasp: EDGE_SHORT}   # p4 EDGE_SHORT — 10/7 잡기 폭 시험 그대로 OK
  - {x_m: 0.5450, y_m: 0.1698, surface_z_m: -0.018, yaw_deg: 0.3, block_up: LENGTH, tcp_z_m: 0.0596, grip_display_width_m: 0.0344, grasp: STAND_LONG}   # p5 STAND_LONG — 10/7 잡기 폭 시험 그대로 OK
  - {x_m: 0.5445, y_m: 0.2620, surface_z_m: -0.018, yaw_deg: -89.7, block_up: LENGTH, tcp_z_m: 0.0646, grip_display_width_m: 0.0244, grasp: STAND_SHORT}   # p6 STAND_SHORT — 10/7 잡기 폭 시험 그대로 OK

observe_pose: {joints_deg: [-18.25, 1.73, 72.73, 0.02, 105.52, 71.44]}   # 관측 자세 (W018, 10/6 실기 확인·민범진 OK): TCP (350.5, -109.0, 294.8) mm 아래 방향, 작업대까지 약 497 mm. 조립 영역(초록 사각형)이 화면 가운데에 다 보임
observe_supply_pose: {joints_deg: [19.2, 14.19, 58.27, 0.02, 107.53, 18.89]}   # 공급 관측 자세 (W134, 10/7 실기 확인 — 카메라 → 작업대 495.9 mm, 흩뿌릴 영역 x 183~586 · y 142~337 mm 다 보임): observe 와 같은 높이, 카메라 90° 돌림(화면 긴 쪽 = x). TCP (424.5, 154.4, 294.8) mm → 카메라 중심이 흩뿌릴 영역 가운데 (388, 230) mm 위 약 497 mm
observe_front_pose: {joints_deg: [-67.2, -35.6, 110.6, 26.2, 92.7, 27.7]}   # 스캔 앞 자세 (W134, 10/7 실기 확인 — 원점 위 75 mm 가 화면 가운데 6 px 안, 거리 458 mm, 구조물 225x225x150 mm 다 보임): 로봇 쪽에서 30° 기울여 봄, 카메라 (196, -72, 455) mm
observe_side_pose: {joints_deg: [-52.9, 32.0, 47.2, 24.4, 128.0, 48.0]}   # 스캔 옆 자세 (W134, 10/7 실기 확인 — 원점 위 75 mm 가 화면 가운데 7 px 안, 거리 458 mm, 구조물 다 보임. 화면은 옆으로 누움): 조립 영역 y- 쪽에서 35° 기울여 봄, 카메라 (426, -336, 434) mm
home_pose: {joints_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]}

finger:
  thickness_m: 0.0114          # RG2 모델 메시 값 (캘리퍼스 W011)
  width_m: 0.020

timeout:                       # 작업 관리자가 답을 기다리는 시간 제한(s) — 넘으면 TIMEOUT = 먼저 세움 → 사람 호출 (IRD 7장 · 9장, W121 C-2, 10/7 PL)
  service_s: 5                 # ROS 서비스 한 번(save_build · get_design 등). 이 값이 save_build 다시 보내기 간격도 정한다
  move_to_s: 45                # move_to(관측 · 홈 · 촬영 자세) 한 번. pick_place 안 최악(계획 20 s = 5 s x 플래너 2 x 여유 2단계 + 이동 ~10 s + 도착 대기 5 s)보다 길게 — 10/7 PL 30 -> 45
  pick_place_s: 90             # pick_place 액션 블록 1개(실기 블록당 약 18 s, 최악 계획 · 이동이 두 번). 넘으면 task 가 목표를 취소 → pick_place 가 서기 궤적으로 세움

check:                         # 검사 묶음 DesignChecker (IRD 9장, 10/7 W109)
  margin_mm: 7                 # 쌓는 도중 무게중심이 받침 가장자리에서 이만큼 안쪽이어야 통과 (구조 유지 한계, V-02)
  max_blocks: 54               # 설계 한 개의 블록 수 상한 (젠가 1세트)

gripper:
  force_n: 10.0                # 드라이버는 2.5 N 단위로만 바꾼다
  open_margin_m: null          # (측정 전) — 지금은 잡기별 grasp_open_place_m 을 쓴다
  feedback_offset_m: 0.0094    # 잡았을 때 표시(피드백) 폭 = 실제 폭 + 이 값
  command_offset_m: 0.0085     # 실제 폭 = 명령 폭 - 이 값 (10/6 캘리퍼스: 50 -> 41.7, 100 -> 91.3 mm). 그리퍼 노드가 더해서 명령한다
  check_tolerance_m: 0.005     # |실제 폭 - grasp_width_m| 이 이 안이면 잡힘
  settle_timeout_s: 4.0        # 명령 뒤 폭이 멈출 때까지 기다리는 최대 시간
  finger_height:               # 손가락 끝 높이 보정점: 다 닫고(표시 9 mm) 끝이 작업대에 닿을 때의 rg2_tcp z
    touch_tcp_z_m: 0.011         # 10/6 직접 교시 (한세교). 이전 0.0112 (10/4 펜던트) — 무는 깊이만 0.2 mm 바뀜
    touch_display_width_m: 0.009

grasp_depth_m: 0.011           # 블록 윗면에서 손가락 끝까지 (15 mm 블록이면 끝이 바닥 4 mm 위)

# 잡기 6가지 (IRD 2장). 폭은 실제 손가락 끝 사이 거리 (그리퍼 노드가 command_offset_m 을 더해 명령)
grasp_width_m:                 # 닫힌 폭 = 블록 치수 (잡힘 판정 기준)
  {FLAT_SHORT: 0.025, FLAT_LONG: 0.075, EDGE_SHORT: 0.015, EDGE_LONG: 0.075, STAND_SHORT: 0.015, STAND_LONG: 0.025}
# 집을 때 열림 = 닫는 방향 블록 실측 + 2 x 한쪽 여유. 한쪽 여유 = 위치 오차 e(가정 2 mm, 실기로 확인) + 3.8 mm
# (안전 3 · yaw 3도 0.6 · 폭 명령 0.2). 좁게 열어 옆 블록을 덜 친다 — 열수록 손가락 끝이 올라가므로(RG2 호) 좁혀도 작업대엔 안 닿음
# 10/7 튜닝 전 값: FLAT_SHORT 0.060, FLAT_LONG 0.100, EDGE_SHORT 0.050, EDGE_LONG 0.100, STAND_SHORT 0.050, STAND_LONG 0.060
grasp_open_pick_m:
  {FLAT_SHORT: 0.0365, FLAT_LONG: 0.0865, EDGE_SHORT: 0.0265, EDGE_LONG: 0.0865, STAND_SHORT: 0.0265, STAND_LONG: 0.0365}
# 놓을 때 열림 = 집을 때와 같게 (10/7) — 놓는 자리 옆에 쌓인 블록을 덜 치고, 좌판 FLAT_LONG 은 100 mm 로 열어 삐끗하던 것(10/6)을 줄인다.
# LV1 다리 기둥 사이 틈 25 mm 조건: 2 x (37.5 - 손가락 11.4 - 여유 3) = 46 mm 미만 — SHORT 폭 모두 만족
# 10/7 튜닝 전 값: FLAT_SHORT 0.040, FLAT_LONG 0.100, EDGE_SHORT 0.035, EDGE_LONG 0.100, STAND_SHORT 0.035, STAND_LONG 0.040
grasp_open_place_m:
  {FLAT_SHORT: 0.0365, FLAT_LONG: 0.0865, EDGE_SHORT: 0.0265, EDGE_LONG: 0.0865, STAND_SHORT: 0.0265, STAND_LONG: 0.0365}
grasp_close_m:                 # 닫기 명령 — 블록보다 5 mm 작게 줘서 힘이 걸리게 한다
  {FLAT_SHORT: 0.020, FLAT_LONG: 0.070, EDGE_SHORT: 0.010, EDGE_LONG: 0.070, STAND_SHORT: 0.010, STAND_LONG: 0.020}

motion:
  approach_m: 0.08             # 집기·놓기 위 이 높이에서 수직 직선으로 내려가고 올라온다
  transit_clearance_m: 0.02    # 공중 이동 계획 때 놓인 블록과 띄우는 여유 (10/6 실기: 여유 없이 등받이에 부딪힘)
  pick_up_m: 0.0
  place_up_m: 0.001            # 블록 바닥이 이만큼 떠 있을 때 연다. 닿으면 충돌 감지로 설 수 있고, 2 mm 는 떨어지며 뒤틀림 (10/6 실기 4 -> 2 -> 1 mm)

speed_scale: 0.3               # 속도 비율 (10/6 LV1 실기 0.1 -> 6칸 잡기 시험 뒤 0.3)
place_tolerance_m: 0.002       # 배치 목표 정밀도 — 판정은 1차 뒤 (W100)

turn:
  hand_absent_s: 3
  start_warning_s: 2

stop:
  vision_timeout_s: 1          # 1차 뒤 (W066)
  first_wait_s: 2.0            # 서기 궤적 뒤 이 안에 안 서면 move_stop
