# D2 설정 파일 — 좌표·높이·힘·시간은 코드에 쓰지 않고 여기 하나에 둔다 (IRD 9장).
# 단위: 길이 m (이름 끝 _m), 각 도 (_deg), 시간 s (_s), 힘 N (_n). 기준 좌표계 base_link.
# 틀: 황인재 (W031). 측정값: 로봇 동작 (W033).
# 10/6 박진용: recipe_demo/config/cell.json 값으로 처음 채움 → 10/6 다시 측정 (W011~W016).

# 공급 방식 스위치 (E-55, 10/7 21시 PL): scatter = 흩뿌린 공급(find_blocks → 고르기 → supply_slot 빈 값, 기본) · slots = 공급 칸 6개(칸 좌표로 바로 집음).
# 작업 관리자만 읽는다. 10/13 PL: 공급 칸은 13일부로 없애고 흩뿌림만 쓴다 — 기본 slots → scatter, 칸 코드 경로는 남기되 안 씀.
supply_mode: scatter

frame_id: base_link
tcp_link: rg2_tcp                # 두산 posx 틀과 위치 같고 방향은 손목 Z 로 -90°: R_rg2tcp = R_posx · Rz(-90°) (x_rg2 = -y_posx, y_rg2 = x_posx, 10/7 W134 실측)
table_z_m: 0.000               # 작업면 높이(base_link z). 10/11 E-85: 로봇 바닥 금속판이 책상과 같은 높이 + 종이(1 mm 미만) · 플랜지 자 측정 약 −1 mm.
                               # 옛 −0.018 은 손끝 닿기 높이에서 29 mm 를 뺀 값(10/6) — 실제 손끝은 rg2_tcp 아래 약 11 mm 라 18 mm 낮았다.
                               # W152(10/11 한세교): 다 닫은 손끝 닿기 4곳 TF z 평균 11.04 mm(차 0.70) = finger_height.touch_tcp_z_m 그대로
                               # 집기 · 놓기 높이는 손끝 닿기 보정점(finger_height) 기준 차이라 이 값과 assembly_origin.z_m 을 같이 바꾸면 그대로다(손목 보정 높이도 이 값에 고정)
table:                         # MoveIt 장면의 작업대 상자 (1200 x 650 mm). 로봇 바닥 둘레 base_clear_m 만 비운다
  x_m: [-0.2675, 0.9325]
  y_m: [-0.325, 0.325]
  base_clear_m: 0.15
  base_clear_back_m: 0.335       # 로봇 뒤쪽(y−)만 이만큼 비움(W175, 10/12 박진용): MoveIt 로봇 바닥 모델(선 부분)이 y −322 mm 까지 나와 table_3 와 겹쳐 계획이 출발 충돌로 거절됨. 그쪽엔 작업이 없음

# 조립 원점: 설계도 (0, 0, 0) 이 로봇 좌표로 어디인지. 여기 하나만 쓴다 (10/6 직접 교시로 다시 찍음)
assembly_origin: {x_m: 0.4261, y_m: -0.0725, z_m: 0.000, yaw_deg: 0.3}   # z 는 table_z_m 과 같이(10/11 E-85, 옛 −0.018)
assembly_area_half_m: 0.15     # 조립 작업공간 = 조립 원점 ± 이 값 (x·y). 여러 설계를 세트로 놓을 때 이 안에 둔다

block_size_m: [0.075, 0.025, 0.015]   # 젠가 블록 설계 치수 LENGTH, WIDTH, THICKNESS = 최대 기준값 (레시피와 같아야 함)
block_actual_m: [0.07445, 0.0248, 0.0148]   # 실측 평균 (10/6) — 집는 높이·쌓는 높이·장면 상자에 쓴다
block_tolerance_m: 0.0005      # 실제 블록은 설계 치수보다 이 안에서 작다 (10/6 실측: 75 쪽은 -0.55 로 약간 넘음). 기록용 — 지금 읽는 코드 없음(IRD 9장에 있어 키는 둠)

# 로봇 공급 칸 (10/6 직접 교시로 다시 찍음, 잡기 6가지 순서). block_up = 위를 향하는 블록 축,
# yaw_deg = 블록 긴 쪽 방향 (세우면 25 mm 쪽). tcp_z_m·grip_display_width_m = 10/4 교시 집는 높이 (세운 블록은 더 깊게 문다)
# grasp = 이 칸에서 쓰는 잡기 하나 (칸마다 고정 — 그리퍼 방향을 찍을 때 그대로 쓴다)
# 10/10 TCP를 손가락 가운데로(펜던트 GripperDA_v1 값을 [0, 2.7, 228]로 편집, tcp.json — E-81) 바꾸며 6칸 모두 y +2.7 mm(박진용 10/8 계산): 옛 TCP 로 맞춘 좌표라, 칸마다 노드가 실제로 고르는
# 집기 자세(닫힘 각도 ±180° — p1 · p2 는 004 로그, p3~p6 은 같은 IK)에서 손가락 가운데 비킴(rg2_tcp x −2.7)이 base +y 2.7 mm 이므로
# 같은 손가락 위치로 집게 옮겼다. x · 높이는 그대로. 실기 확인 = PL ④ 3동작.
# 10/10 15시(PL 결정 — 펜던트로 찍은 좌표를 TF 기준으로): 손목 카메라(10/10 보정, V-15 관측 4/4 ≤ 2 mm)로 공급 관측 자세에서 블록을 3번 따로 놓아 잰
# 윗면 중심 평균으로 p1 ~ p4 · p6 을 바꿈(차 p1 (−2.2, −3.0) · p2 (−2.9, +1.6) · p3 (−1.7, −3.5) · p4 (−2.8, +0.5) · p6 (+1.7, −0.6) mm). p5 는 그대로.
# 그리퍼는 닫는 방향만 가운데로 맞춰 주므로 블록 긴 쪽 방향 어긋남은 그대로 놓는 오차가 된다 — 확인 = W150 · W151 실기에서 칸마다 한 번 집기.
supply_slots:
  - {x_m: 0.2800, y_m: 0.1793, yaw_deg: -0.3, block_up: THICKNESS, grasp: FLAT_LONG}   # p1 FLAT_LONG — 10/10 손목 카메라 놓기 3번 평균(흔들림 x ±1.1 · y ±0.1, 전 0.2822 · 0.1823)
  - {x_m: 0.2743, y_m: 0.2655, yaw_deg: -89.8, block_up: THICKNESS, grasp: FLAT_SHORT}   # p2 FLAT_SHORT — 10/10 손목 카메라 놓기 3번 평균(±0.2 · ±0.2, 전 0.2772 · 0.2639)
  - {x_m: 0.3989, y_m: 0.1775, yaw_deg: 0.0, block_up: WIDTH, tcp_z_m: 0.0177, grip_display_width_m: 0.0244, grasp: EDGE_LONG}   # p3 EDGE_LONG (깊이 = p4, 10/6 실기: 계산식은 윗부분만 물림) — 10/10 손목 카메라 놓기 3번 평균(±0.3 · ±0.3, 전 0.4006 · 0.1810)
  - {x_m: 0.4003, y_m: 0.2620, yaw_deg: -89.9, block_up: WIDTH, tcp_z_m: 0.0177, grip_display_width_m: 0.0244, grasp: EDGE_SHORT}   # p4 EDGE_SHORT — 10/10 손목 카메라 놓기 3번 평균(±0.1 · ±0.5, 전 0.4031 · 0.2615)
  - {x_m: 0.5450, y_m: 0.1725, yaw_deg: 0.3, block_up: LENGTH, tcp_z_m: 0.0596, grip_display_width_m: 0.0344, grasp: STAND_LONG}   # p5 STAND_LONG — 10/7 잡기 폭 시험 그대로 OK. 10/10 카메라 값은 안 씀(세운 블록 윗면이 16.7 × 16.0 mm로 잡혀 기대 24.8 × 14.8과 달라 믿기 어려움 — 놓기 3번 x −4.4 ~ −0.3)
  - {x_m: 0.5462, y_m: 0.2641, yaw_deg: -89.7, block_up: LENGTH, tcp_z_m: 0.0646, grip_display_width_m: 0.0244, grasp: STAND_SHORT}   # p6 STAND_SHORT — 10/10 손목 카메라 놓기 3번 평균(±0.8 · ±0.4, 전 0.5445 · 0.2647)

# 흩뿌린 공급 영역(작업대 빨간 테이프) — 축에 나란한 직사각형 (base_link m, [최소, 최대]). block_finder 가 읽는다(W086).
# 10/11 박진용 직접 교시(손목 버튼으로 끌기): 두 손가락 가운데를 테이프 꼭짓점에 맞추고 MoveIt FK rg2_tcp 로 읽음(공구 기울기 ≤ 0.6°)
# — 꼭짓점 (x, y mm) (173.7, 122.1) · (592.3, 117.5) · (594.8, 312.3) · (171.8, 314.6), 기록 ~/d2_data/runs/teach_area_10111056.json.
# 네 꼭짓점의 안쪽 사각형(테이프 밖은 안 들어가고, 테이프가 축과 어긋난 가장자리 최대 약 5 mm 는 빠짐).
# 로봇 쪽 구석(x < 0.25 · y < 0.17)은 눕힌 블록 IK 가 안 풀린다(W134). 10/12 박진용: 빨간 테이프 안 전체에 흩뿌린다(빈 자리를 영역 밖으로 옮김)
supply_area_m: {x_m: [0.1737, 0.5923], y_m: [0.1221, 0.3123]}
# 임시 적재 자리 (base_link m · yaw = 블록 긴 쪽 방향 · z_m = 받침 윗면). 옛 자리(나무 판 x 658 mm · 10/12 교시 근거)는 git 이력에.
# spare_spots 첫 자리 = 중간 놓는 자리(p1) = 받침 윗면 가운데(10/13 박진용 — 공급 영역 안 작업대 p1 (280.0, 179.3) 에서 옮김). yaw 90 = 블록 긴 축을 y 로(10/13 박진용: 전면 y 통일 —
# 받침 폭 80 mm 에 블록 74.45 mm 라 양쪽 2.8 mm). 공급 영역 밖이라 one_pick 은 p1 블록을 바로 위에서 깊이로만 잰다.
# 옆으로 선 블록은 +x 로 눕힌다(긴 축 y 그대로). 세운 블록만 받침 긴 변(x) 쪽으로 넘겨 x 로 눕는다 — y 로 넘기려면 넘기기 전 세운 자리가
# 가운데에서 44.6 mm(받침 반폭 40 mm 밖). 세움 레시피(3번) 45° 세우기도 이 자리를 쓴다.
# 시험 도구 one_pick 도 이 첫 자리를 읽는다(옛 stand_spot 키 — 같은 값이 두 곳이라 10/13 뺌)
# 세우기 교시 동작(W131 한세교)도 이 자리 · 받침을 쓴다 — 값은 한세교 standup_taught block_xy_m · support_box_m 에 맞춤(10/13, 키는 이것 하나)
spare_spots:
  - {x_m: 0.36747, y_m: -0.2850, z_m: 0.080, yaw_deg: 90.0}
# 받침 (10/13 박진용 — 옛 나무 판 · 그 위 물건은 치움): 80(높이) × 80(y) × 280(x) mm, 윗면 가운데 = 교시 진입 · 파지 Task (367.47, −284.99 · −285.01) mm,
# 윗면 80 mm(45° 파지 Task Z 90.03 + 45° 파지 손끝 깊이 4.73 = 블록 윗면 94.8 − 두께 14.8). 장면 관리가 상자로 넣는다(작업대 ~ spare_spots z_m).
spare_base_m: {x_m: [0.22747, 0.50747], y_m: [-0.3250, -0.2450]}
spare_items_m: []

# 세우기 교시 동작(W131) — 한세교 TP 직접 교시 · 실물 확인(높게세움 10/12 · 옆세움 10/13). 값 = 펜던트 posx 그대로
# [x, y, z mm, A, B, C 도(ZYZ)], 좌표계 BASE · 활성 TCP GripperDA_v1. 모든 이동 MoveL(Pilz LIN). 원본(사진 · 관절값)은 한세교
# experiments/w131_virtual_test/taught_temp_poses.json(git 밖). 자리 · 받침은 spare_spots 첫 자리 · spare_base_m(받침 키 정본, 10/13)
# 순서: 진입(툴 수직, 파지 바로 위) → 파지(기울여 내려감) → 리프트업 → 회전(닫힘 축 둘레) → 내려놓기 → 열기 → Z+ lift_after_place_m → 진입.
# 잡기 STANDUP_HIGH(세움 — LENGTH 위) · STANDUP_SIDE(옆세움 — WIDTH 위)로 부른다(10/13 박진용 · IRD 2장)
standup_taught:
  spot_tolerance_m: 0.015          # 집기 · 놓기 블록 중심이 spare_spots 첫 자리에서 이 안일 때만 교시 동작을 쓴다 — 다른 자리 요청을 이 좌표로 옮기지 않게
  lift_after_place_m: 0.08         # 놓고 연 뒤 Z+ 상승(10/13 한세교) — 높게세움 손끝 202 mm 로 세운 블록 윗면 155 mm 보다 47 mm 위
  high:                            # 높게세움 — FLAT_SHORT(닫힘 base X), base X 둘레 −88.35° (원점에서 +X 를 봐 반시계)
    grasp: FLAT_SHORT
    entry: [367.47, -284.99, 194.98, 141.43, 180.0, 141.19]
    pick: [367.47, -285.01, 95.03, 90.0, 129.42, 90.0]   # Z 교시 90.03 → +5 mm(10/13 한세교 — 90 까지 내려가 잡으면 충돌)
    lift_up: [367.47, -285.01, 140.03, 90.0, 129.42, 90.0]
    rotate: [367.47, -285.01, 140.03, 90.0, -142.67, 90.0]
    place: [367.47, -285.01, 122.03, 90.0, -142.23, 90.0]
  side:                            # 옆세움 — FLAT_LONG(닫힘 base Y), base Y 둘레 +90° (원점에서 +Y 를 봐 시계). x · y 는 J6 90° 때 손가락 중심 차이를 교시로 맞춘 값
    grasp: FLAT_LONG
    entry: [370.16, -282.0, 189.98, 180.0, -180.0, -90.0]
    pick: [370.16, -282.0, 85.04, 180.0, -135.0, -90.0]
    lift_up: [370.13, -282.02, 110.0, 180.0, -135.0, -89.99]
    rotate: [370.12, -282.02, 109.99, 180.0, 135.0, -90.0]
    place: [370.11, -282.02, 92.02, 0.0, -135.0, 90.0]

observe_pose: {joints_deg: [-18.25, 1.73, 72.73, 0.02, 105.52, 71.44]}   # 관측 자세 (W018, 10/6 실기 확인·민범진 OK): TCP (350.5, -109.0, 294.8) mm 아래 방향, 작업대까지 약 497 mm. 조립 영역(초록 사각형)이 화면 가운데에 다 보임
observe_spare_pose: {joints_deg: [-48.46, 13.34, 53.52, 0.03, 113.13, 41.53]}   # 받침 위 촬영 자세(10/13, 받침 경유) — 손끝 (294.6, −320.1, 330) mm · 공구 아래 · 닫힘 90°, 손목 카메라 렌즈가 받침 가운데(367.5, −285.0) 위 532 mm. 10/13 b1: one_pick look_spare 계산(렌즈가 받침 가운데 위), 반올림 없음 — 10/13 one_pick 실기 로그 '촬영 자리' 값과 같음(1° 반올림 값은 렌즈가 4 mm 비킴)
observe_supply_pose: {joints_deg: [19.2, 14.19, 58.27, 0.02, 107.53, 18.89]}   # 공급 관측 자세 (W134, 10/7 실기 확인 — 카메라 → 작업대 495.9 mm, 흩뿌릴 영역 x 183~586 · y 142~337 mm 다 보임): observe 와 같은 높이, 카메라 90° 돌림(화면 긴 쪽 = x). TCP (424.5, 154.4, 294.8) mm → 카메라 중심이 흩뿌릴 영역 가운데 (388, 230) mm 위 약 497 mm
observe_front_pose: {joints_deg: [-67.2, -35.6, 110.6, 26.2, 92.7, 27.7]}   # 스캔 앞 자세 (W134, 10/7 실기 확인 — 원점 위 75 mm 가 화면 가운데 6 px 안, 거리 458 mm, 구조물 225x225x150 mm 다 보임): 로봇 쪽에서 30° 기울여 봄, 카메라 (196, -72, 455) mm
observe_side_pose: {joints_deg: [-52.9, 32.0, 47.2, 24.4, 128.0, 48.0]}   # 스캔 옆 자세 (W134, 10/7 실기 확인 — 원점 위 75 mm 가 화면 가운데 7 px 안, 거리 458 mm, 구조물 다 보임. 화면은 옆으로 누움): 조립 영역 y- 쪽에서 35° 기울여 봄, 카메라 (426, -336, 434) mm
home_pose: {joints_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]}
observe_back_left_pose: {joints_deg: [19.99, 52.28, 38.07, -47.94, 131.38, 30.69]}   # 스캔 대각선 · 먼 쪽 y+ (W186, 10/12 민범진 실기 — 5자세 스캔 47/47): 원점 둘레 +60° · 30° 내려봄 · 340 mm
observe_front_right_pose: {joints_deg: [-57.58, 34.25, 65.22, 35.05, 108.47, -39.23]}   # 스캔 대각선 · 로봇 쪽 y− (W186, 10/12 실기): 400 mm. 처음 값(6번 축 +143.7°)은 가는 길 6번 축 +97° 에서 SAFE_STOP 3번이라 6번 축 −39° 해로 바꿈

finger:
  thickness_m: 0.0114          # RG2 모델 메시 값 (캘리퍼스 W011)
  width_m: 0.020

timeout:                       # 작업 관리자가 답을 기다리는 시간 제한(s) — 넘으면 TIMEOUT = 먼저 세움 → 사람 호출 (IRD 7장 · 9장, W121 C-2, 10/7 PL)
  service_s: 3                 # ROS 서비스 한 번(save_build · get_design 등). 이 값이 save_build 다시 보내기 간격도 정한다. 3초 = get_design이 화면 요청(MQTT 5초) 안에서 끝나게(10/7 PL, 5 → 3)
  command_s: 4                # 화면 명령(설계 선택 · 출발)을 받은 뒤 이 시간 안에 확정 못 하면 실행하지 않고 TIMEOUT. 화면 MQTT 요청 5초보다 먼저 끝나야 웹이 시간 초과로 본 명령이 뒤늦게 실행되지 않는다(10/7 PL 황인재, E-55)
  find_blocks_s: 10            # find_blocks 한 번(높이 지도 · 받침 재기 포함) — 받침 경유(10/13): one_pick 과 같은 10 s. 넘거나 실패하면 find_retries 번 다시 뒤 사람
  find_retries: 2              # find_blocks · 받침 재기가 실패하면 이만큼 다시(받침 경유, one_pick 은 될 때까지 — 끝없이 돌지 않게 수로 묶음)
  move_to_s: 45                # move_to(관측 · 홈 · 촬영 자세) 한 번. pick_place 안 최악(계획 20 s = 5 s x 플래너 2 x 여유 2단계 + 이동 ~10 s + 도착 대기 5 s)보다 길게 — 10/7 PL 30 -> 45
  pick_place_s: 120            # pick_place 액션 블록 1개(실기 블록당 약 18 s, 최악 계획 · 이동이 두 번). 넘으면 task 가 목표를 취소 → pick_place 가 서기 궤적으로 세움
                               # 10/13 90 → 120(받침 경유 — one_pick 결과 120 s, 기울여 집기 · 눕히기는 직선이 절반 속도로 다시 계획될 때가 있음)

recover:
  speed_ratio: 0.4             # 정지 해제 뒤 첫 관측 이동은 평소 속도의 이 비율(0.5 x 0.4 = 0.2, 10/14 박진용 0.15 → 0.2). 성공 뒤 평소 속도로 돌아감 (IRD W121 C-1)

mqtt:                          # PC 사이 MQTT (IRD 9 · 10장). 다리(d2_bridge)가 읽고, req_timeout_s · alive_s · lost_after_s 는 웹 backend(mqtt_client)도 읽는다(웹 host · port 는 웹 PC .env)
  host: localhost              # 브로커(웹 PC) 주소 — 웹 PC IP 는 W129 때 정함. 그 전엔 실행 때 -p mqtt_host:=<IP> 로 바꾼다
  port: 1883
  qos: 1                       # 명령 · 요청 · 응답 · 상태 토픽 QoS (그리퍼 상태만 0 — IRD 10.1 표)
  req_timeout_s: 5             # 로봇이 부른 get_design · save_build 의 웹 응답을 기다리는 시간. 화면 쪽 요청 제한과 같은 값 (IRD 7장)
  alive_s: 1                   # 다리 연결 신호 d2/bridge/alive 보내는 주기
  lost_after_s: 3              # 웹 연결 신호 끊김 판정. task 는 MQTT 를 직접 쓰지 않고 /d2/hmi/alive 만 본다 (IRD 10.3)

scan:
  poses: [observe, observe_back_left, observe_front, observe_front_right, observe_side]  # 촬영·poses_used 모두 이 순서(W186, 10/12 실기 5자세 47/47).
                                 # 순서 중요: observe_side → observe_back_left 로 바로 가면 손가락이 구조물 상자에 닿는다(10/12 가상 검사)
  structure_box_m: [0.30, 0.30, 0.20]  # 스캔 이동 때 피할 구조물 자리(조립 원점 위, 바닥 = table_z_m — 사람이 쌓아 장면에 없다). 10/12 실기 5자세 이동을 이 상자로 검증(W186)

find:                          # 흩어진 블록 집기 (IRD 9장, E-49)
  min_gap_mm: 22.2             # 집을 블록 주변 틈 기준 = 2e + 18.2 (e = 위치 오차 2 mm 가정 — 보정 · V-15 확인 전 값). find_blocks 의 clear 와 W130 고르기가 읽는다

scatter:                       # 흩뿌린 공급 집기 실패 뒤 재시도 (W178, 10/12 PL 확인 대상)
  max_attempts: 3              # 같은 목표 블록의 총 집기 시도 수 — 이 수를 채우면 서서 사람을 부른다. 재관측 · 정지 · 복구로 비우지 않고, VERIFY 에서 present 로 확인된 뒤에만 지운다.
                               # via_spare 면 팔이 움직인 실패만 센다 — 블록 하나에 공급 · 받침 단계(받침에 옮기기 · 눕히기 · 맞추기 · 다시 집기)를 합쳐 3번(10/12 ~ 13 박진용 실기 규칙 — 2 → 3, 10/13 PL)
  via_spare: true              # 받침 경유(10/13 PL 10시 지시): 공급에서 집기 쉬운 블록(BlockPicker.rank) → 받침(spare_spots 첫 자리)에 눕힘 →
                               # observe_spare 에서 find_blocks area 'spare' 로 재기 → 레시피 잡기로 곧게 다시 집어 조립. false 면 전처럼 바로 조립
  place_dz_m: 0.005            # 받침 경유 VERIFY: 놓은 블록 높이 어긋남이 이 안이어야 하고 present 여야 함(one_pick CHECK_DZ_M 5 mm) — 아니면 사람이 고치고 [계속]
  gripper_wait_s: 1.5          # 집기 실패 뒤 믿을 gripper 상태(결과 이후 stamp)를 기다리는 상한(s). gripper 가 1초마다 + 바뀔 때 내므로 주기 1.0 + 여유 0.5 로 잡은 운영 설정 제안값 — 도착 시간을 실측으로 보장하지 않는다. 넘으면 모르는 것으로 보고 기존 복구 절차
  gripper_max_age_s: 3         # 집기 실패 뒤 gripper/state 를 믿는 최대 나이(s). 1초마다 + 바뀔 때 내므로 3초(박진용 확인, scatter_pick.grasped_now). 결과보다 이전 값은 나이와 상관없이 믿지 않는다

check:                         # 검사 묶음 DesignChecker (IRD 9장, 10/7 W109)
  margin_mm: 7                 # 쌓는 도중 무게중심이 받침 가장자리에서 이만큼 안쪽이어야 통과 (구조 유지 한계, V-02)
  max_blocks: 54               # 설계 한 개의 블록 수 상한 (젠가 1세트)

gripper:
  force_n: 10.0                # 드라이버는 2.5 N 단위로만 바꾼다
  max_width_m: 0.110           # 그리퍼 '활짝' = RG2 드라이버 명령 상한(m, 10/13 PL E-108 — 키 하나). 그리퍼 노드가 요청 폭 + command_offset_m
                               # (8.5 mm)을 이 값에서 잘라 보내므로 '활짝'은 실제 약 101.5 mm. 집기 · 놓기는 '활짝'을 이 값으로 요청한다
                               # (관측 · 촬영 때 손가락이 손목 카메라에 안 찍히게 — 10/11). 그리퍼 열기(W183 · E-98) 0.0865 m 는 따로
  finger_center_close_m: 0.0019  # 손가락 쌍 가운데가 rg2_tcp 에서 닫힘 축(rg2 y +) 방향으로 비킨 양(m) — 집기 노드가 IK 가 고른 손목 방향 기준으로
                               # TCP 를 반대로 옮긴다. 0 = 끔. 10/13 1.75 mm(손가락이 닫히기 시작한 뒤 찍은 사진 — 이미 한쪽이 닿아 블록을 밀어 작게 잼)
                               # 로 넣었다가 1층 놓기에서 옆 블록을 눌러 SAFE_STOP → 되돌림. 10/13 09:2x 손가락이 열린 채 멈춘 사진 20장: 틈 비 1.3 : 3.8
                               # (화면 mm, 손끝 높이 · 원근 탓 의심) → 틈 합 12.05 mm 로 맞추면 2.9 mm 였지만, 같은 실행(보정 0 · 렌즈를 p1 바로 위에서 잰 값)을
                               # 눈으로 보니 거의 가운데(10/13 박진용) → 0 유지. 어제 끝면에 붙던 것은 p1 을 화면 끝에서 잰 옛 촬영 자리 탓으로 본다.
                               # TCP 정의(tcp.json)는 손목 카메라 보정과 묶여 있어 그대로 둔다
                               # 10/13 박진용: 1.9 mm 로 — W144 사진으로 보정 0 에서 놓인 블록 18개를 다시 잼(놓던 순간 손목 방향은 관절 FK):
                               # 놓인 자리 − 목표의 닫힘 축(y) 성분 평균 +1.9 mm(표준편차 1.3, −0.4 ~ +4.0, 18개 중 17개 +), 좁은 폭 +1.9 · 넓은 폭 +2.3.
                               # 1층 SAFE_STOP 은 같은 층 옆 블록 틈 0.2 mm 탓으로 보고 one_pick 이 1 mm 띄운다(함께 넣음). 다음 실기 뒤 같은 재기로 평균이 0 근처인지 본다
  open_margin_m: null          # (측정 전) — 지금은 잡기별 grasp_open_place_m 을 쓴다
  feedback_offset_m: 0.0094    # 잡았을 때 표시(피드백) 폭 = 실제 폭 + 이 값
  command_offset_m: 0.0085     # 실제 폭 = 명령 폭 - 이 값 (10/6 캘리퍼스: 50 -> 41.7, 100 -> 91.3 mm). 그리퍼 노드가 더해서 명령한다
  check_tolerance_m: 0.005     # |실제 폭 - grasp_width_m| 이 이 안이면 잡힘
  settle_timeout_s: 4.0        # 명령 뒤 폭이 멈출 때까지 기다리는 최대 시간
  finger_height:               # 손가락 끝 높이 보정점: 다 닫고(표시 9 mm) 끝이 작업대에 닿을 때의 rg2_tcp z
    touch_tcp_z_m: 0.011         # 10/6 직접 교시 (한세교). 이전 0.0112 (10/4 펜던트) — 무는 깊이만 0.2 mm 바뀜
    touch_display_width_m: 0.009

grasp_depth_m: 0.011           # 블록 윗면에서 손가락 끝까지 (15 mm 블록이면 끝이 바닥 4 mm 위)

# 잡기 6가지 (IRD 2장). 폭은 실제 손가락 끝 사이 거리 (그리퍼 노드가 command_offset_m 을 더해 명령)
grasp_width_m:                 # 닫힌 폭 = 블록 치수 (잡힘 판정 기준)
  {FLAT_SHORT: 0.025, FLAT_LONG: 0.075, EDGE_SHORT: 0.015, EDGE_LONG: 0.075, STAND_SHORT: 0.015, STAND_LONG: 0.025}
# 집을 때 열림 = 닫는 방향 블록 실측 + 2 x 한쪽 여유. 한쪽 여유 = 위치 오차 e(가정 2 mm, 실기로 확인) + 3.8 mm
# (안전 3 · yaw 3도 0.6 · 폭 명령 0.2). 좁게 열어 옆 블록을 덜 친다 — 열수록 손가락 끝이 올라가므로(RG2 호) 좁혀도 작업대엔 안 닿음
# 10/7 튜닝 전 값: FLAT_SHORT 0.060, FLAT_LONG 0.100, EDGE_SHORT 0.050, EDGE_LONG 0.100, STAND_SHORT 0.050, STAND_LONG 0.060
grasp_open_pick_m:
  {FLAT_SHORT: 0.0365, FLAT_LONG: 0.0865, EDGE_SHORT: 0.0265, EDGE_LONG: 0.0865, STAND_SHORT: 0.0265, STAND_LONG: 0.0365}
# 놓을 때 열림 = 집을 때와 같게 (10/7) — 놓는 자리 옆에 쌓인 블록을 덜 치고, 좌판 FLAT_LONG 은 100 mm 로 열어 삐끗하던 것(10/6)을 줄인다.
# LV1 다리 기둥 사이 틈 25 mm 조건: 2 x (37.5 - 손가락 11.4 - 여유 3) = 46 mm 미만 — SHORT 폭 모두 만족
# 10/7 튜닝 전 값: FLAT_SHORT 0.040, FLAT_LONG 0.100, EDGE_SHORT 0.035, EDGE_LONG 0.100, STAND_SHORT 0.035, STAND_LONG 0.040
grasp_open_place_m:
  {FLAT_SHORT: 0.0365, FLAT_LONG: 0.0865, EDGE_SHORT: 0.0265, EDGE_LONG: 0.0865, STAND_SHORT: 0.0265, STAND_LONG: 0.0365}
grasp_close_m:                 # 닫기 명령 — 블록보다 5 mm 작게 줘서 힘이 걸리게 한다
  {FLAT_SHORT: 0.020, FLAT_LONG: 0.070, EDGE_SHORT: 0.010, EDGE_LONG: 0.070, STAND_SHORT: 0.010, STAND_LONG: 0.020}

motion:
  approach_m: 0.08             # 집기·놓기 위 이 높이에서 수직 직선으로 내려가고 올라온다
  transit_clearance_m: 0.02    # 공중 이동 계획 때 놓인 블록과 띄우는 여유 (10/6 실기: 여유 없이 등받이에 부딪힘)
  transit_speed_ratio: 1.0     # 자유 이동(MoveIt OMPL — 공중 이동 · 자세 이동)만 speed_scale 의 이 비율로. 10/14 박진용: 평소 속도로 통일(0.667 → 1.0).
                               # 10/13 에 0.667 로 낮춘 까닭(1번 관절이 크게 도는 이동 끝 SAFE_STOP 두 번)은 펜던트 설정(충돌 민감도 75 % · 공구 1.43 kg) 고치기 전 일
  tcp_y_margin_m: 0.005        # 자유 이동 중 손끝(TCP) y ≤ 공급 영역 먼 쪽 끝(supply_area_m y 위 끝) + 이 값 — 탑뷰 위쪽으로 넘어가지 않게(10/13 박진용).
                               # 5 mm = 영역 끝에 놓인 블록을 집은 바로 뒤 출발 자세가 제약 밖으로 잡히지 않게 둔 여유
  pick_speed_ratio: 0.4        # 집으러 내려가는 직선(곧게 · 기울여)만 speed_scale 의 이 비율로(0.5 x 0.4 = 0.2 — 10/14 저녁 박진용 0.15 → 0.2. 10/13: 집기 하강 너무 빠름 — 0.2 → 0.15).
                               # 들어 올리기는 평소 속도(10/14 박진용 — 하강만 느리게, 집기 노드가 같은 직선을 따로 계획)
  place_speed_ratio: 0.4       # 조립 자리에 놓을 때 놓는 높이까지 내려가는 직선만 speed_scale 의 이 비율로 — 조립할 때 살살(0.5 x 0.4 = 0.2, 10/14 저녁 박진용 0.15 → 0.2).
                               # 받침에 놓기 · 빠지기는 평소 속도(10/14 박진용 — 집기 노드가 받침 자리면 1.0, 빠지기는 따로 계획)
  pick_up_m: 0.0
  place_up_m: 0.001            # 블록 바닥이 받침(작업대 · 아래층 계산 윗면) 위 이만큼 떠 있을 때 연다. 10/6 4 -> 2(떨어지며 뒤틀림) -> 1 mm. 10/11 실기 알람 2번(그룹 5 · 7060)은 잡는 높이를 카메라 값으로 써 1.3 ~ 1.8 mm 낮게 문 탓 — 층 높이로 고정한 뒤 1 mm(목표 정확도 1 mm)
  place_offset_flat_short_m: [0.0, 0.0024]   # 조립 자리에 FLAT_SHORT 로 놓는 블록만 놓기 TCP 를 이만큼(base x · y, m) 옮김 — 블록 긴 축에 내린 만큼만(motion_math.place_offset_m).
                               # [0, 0] = 끔. 10/15 PL: 다리가 긴 축(base −y)으로 −2.4 ± 0.8 mm 밀려 놓임(민범진 마스크 사진 22장 · 8d83 다리 8개 −1.43 ~ −3.63) → +2.4 mm 되돌림.
                               # 받침에 놓기는 안 옮김. FLAT_LONG(좌판 긴 축 −0.13 ~ 0.5 mm)은 손가락이 긴 축을 물어 저절로 가운데라 안 옮김

speed_scale: 0.5               # 속도 비율 (10/6 LV1 실기 0.1 -> 6칸 잡기 시험 뒤 0.3 -> 10/14 저녁 박진용 0.5 — 10/13 PL '시연은 0.3 으로 안 줄여도 됨')

stop:
  vision_timeout_s: 1          # 1차 뒤 (W066)
  first_wait_s: 2.0            # 서기 궤적 뒤 이 안에 안 서면 move_stop
