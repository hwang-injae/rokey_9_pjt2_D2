# MoveIt 관절 한계 — dsr_moveit_config_m0609/config/joint_limits.yaml 을 그대로 옮기고 joint_6 속도만 낮춤.
# 왜: 두산 제어기 안전 설정(감속 구역)이 6번 관절을 30 deg/s 로 자른다. MoveIt 이 3.927 rad/s 로 알고 계획하면
#      궤적 시간이 끝나도 손목이 덜 돌아 도착 확인에서 실패한다 (10/6 가상: 31.6 deg 덜 돎).
#      1.0 rad/s x speed_scale 0.3 = 17 deg/s < 30. speed_scale 을 0.5 넘게 올리면 다시 확인한다.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

