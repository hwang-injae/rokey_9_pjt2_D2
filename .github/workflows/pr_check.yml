# PR 검사와 자동 승인 (팀 규칙 7·8·4·9)
# - PR이 열리거나 새로 push되면 돈다.
# - 검사 스크립트는 main 쪽 것을 쓰고(pull_request_target), PR 코드는 읽기만 하고 실행하지 않는다.
#   → PR에서 이 파일을 고쳐도 검사 방식이 바뀌지 않는다(비밀값 보호).
# - 모두 통과하면 자동 승인한다. 승인 계정:
#     · 저장소 비밀값 D2_APPROVER_TOKEN 이 있으면 그 계정(황인재 또는 한세교의 토큰) — CODEOWNERS 승인으로 인정됨
#     · 없으면 github-actions 봇 — 'Allow GitHub Actions to create and approve pull requests' 설정이 켜져 있어야 함
#   승인 계정 본인이 올린 PR은 GitHub이 본인 승인을 막으므로, 다른 승인자(황인재·한세교)가 승인한다.
name: PR 검사

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: 문법·main 반영·충돌·규칙 검사
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: 검사 도구 받기 (main)
        uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false
      - name: PR 코드 받기 (읽기만)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: 최신 main 가져오기
        working-directory: pr
        run: git fetch --no-tags "https://github.com/${{ github.repository }}.git" "main:refs/remotes/origin/main"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 검사 도구 설치
        run: pip install --quiet pyyaml
      - name: 검사
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python base/.github/scripts/pr_check.py --repo pr --base origin/main

  approve:
    name: 자동 승인
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 승인
        env:
          GH_TOKEN: ${{ secrets.D2_APPROVER_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          APPROVER=$(gh api user --jq .login 2>/dev/null || echo "github-actions[bot]")
          if [ "$APPROVER" = "$AUTHOR" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "PR 검사 통과 ✅ — 올린 사람이 자동 승인 계정과 같아서 자동 승인을 못 합니다. 다른 승인자(황인재 @hwang-injae · 한세교 @hansaekyo)가 승인해 주세요."
            exit 0
          fi
          gh pr review "$PR" --repo "$REPO" --approve --body "PR 검사 통과 ✅ 자동 승인 — 문법 · main 반영 · 충돌 없음 · 키/.env 없음 · 커밋 '변경 파일:' · 문서 이름 규칙" \
            || gh pr comment "$PR" --repo "$REPO" --body "PR 검사는 통과했지만 자동 승인을 못 했습니다(승인 토큰·설정 확인 필요). 황인재·한세교가 직접 승인해 주세요."
